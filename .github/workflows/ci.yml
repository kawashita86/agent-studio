name: CI
# Pull requests are the gate: `main` is protected with "require branches to be up to date", so what lands on main is exactly
# what its PR tested, and CI does not run again on the merge. `main` itself runs weekly (and on demand) to refresh the Rust
# cache that pull requests restore from; only those runs save it. `ci/**` branches run on push to try workflow changes.
on:
  pull_request:
  push:
    branches: ['ci/**']
  schedule:
    - cron: '0 5 * * 1' # Mondays 05:00 UTC, on main: keeps the shared cache warm (unused caches are evicted after 7 days)
  workflow_dispatch:

# A new push to a pull request cancels its run still in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    # One job per OS: the desktop app is the only product, so the Rust workspace needs the front end built
    # (Tauri embeds gui/dist) and, on Linux, the WebKit system libraries.
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2 # a pull request checks out its merge commit: HEAD^1 is the base, for ci-scope.sh
      # Version-bump-only pull requests (chore/release-*) take a fast path that still reports this job (required check).
      - name: Scope
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            bash .github/scripts/ci-scope.sh HEAD^1 HEAD
          else
            bash .github/scripts/ci-scope.sh
          fi
      - name: Version bump only (fast path)
        if: steps.scope.outputs.full != 'true'
        shell: bash
        run: |
          # Cargo.lock must agree with the bumped manifests; the Release workflow builds everything from the tag.
          cargo metadata --locked --format-version 1 > /dev/null
          node -e "const a=require('./gui/package.json').version,b=require('./gui/package-lock.json').version;if(a!==b){console.error('gui/package.json '+a+' != package-lock.json '+b);process.exit(1)}"
      - uses: actions/setup-node@v5
        if: steps.scope.outputs.full == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Front end
        if: steps.scope.outputs.full == 'true'
        working-directory: gui
        shell: bash
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Tauri system libraries
        if: steps.scope.outputs.full == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        if: steps.scope.outputs.full == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.full == 'true'
        with:
          # Only main saves: per-PR caches are only visible to their PR and pushed the repo over the 10 GB cache limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo fmt
        if: steps.scope.outputs.full == 'true'
        run: cargo fmt --all --check
      - name: cargo clippy
        if: steps.scope.outputs.full == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        if: steps.scope.outputs.full == 'true'
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee test-output.txt
      - name: Report test failures as annotations
        if: failure() && steps.scope.outputs.full == 'true'
        shell: bash
        run: |
          # Job logs need auth to download; annotations are readable publicly.
          grep -E "panicked at|^---- .* stdout ----|FAILED|error(\[E[0-9]+\])?:" test-output.txt \
            | head -n 40 | while IFS= read -r line; do echo "::error::$line"; done
          awk '/^---- .* stdout ----/{p=1;n=0} p&&n<15{print "::error::"$0;n++}' test-output.txt | head -n 120
