name: CI
on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # One job per OS: the desktop app is the only product, so the Rust workspace needs the front end built
    # (Tauri embeds gui/dist) and, on Linux, the WebKit system libraries.
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Front end
        working-directory: gui
        shell: bash
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee test-output.txt
      - name: Report test failures as annotations
        if: failure()
        shell: bash
        run: |
          # Job logs need auth to download; annotations are readable publicly.
          grep -E "panicked at|^---- .* stdout ----|FAILED|error(\[E[0-9]+\])?:" test-output.txt \
            | head -n 40 | while IFS= read -r line; do echo "::error::$line"; done
          awk '/^---- .* stdout ----/{p=1;n=0} p&&n<15{print "::error::"$0;n++}' test-output.txt | head -n 120
