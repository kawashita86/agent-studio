name: CI
on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: as-tui without syntax highlighting
        run: cargo clippy -p as-tui --all-targets -- -D warnings
      - name: cargo test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee test-output.txt
      - name: Report test failures as annotations
        if: failure()
        shell: bash
        run: |
          # Job logs need auth to download; annotations are readable publicly.
          grep -E "panicked at|^---- .* stdout ----|FAILED|error(\[E[0-9]+\])?:" test-output.txt \
            | head -n 40 | while IFS= read -r line; do echo "::error::$line"; done
          awk '/^---- .* stdout ----/{p=1;n=0} p&&n<15{print "::error::"$0;n++}' test-output.txt | head -n 120
