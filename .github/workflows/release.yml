name: Release

# Tag `vX.Y.Z` (the tag must match the version in Cargo.toml): build the desktop installers for every platform
# (Linux AppImage + deb, macOS dmg for Apple Silicon and Intel, Windows msi; unsigned), publish a GitHub Release
# with generated notes and SHA256SUMS.
# Manual run (workflow_dispatch): the same build, uploaded as workflow artifacts only, nothing is published (dry run).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          # Both macOS targets build on the Apple Silicon runner (x86_64 is a cross build).
          - label: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - label: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - label: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential pkg-config libssl-dev file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Check that the tag matches Cargo.toml
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          # awk, not sed: BSD sed (macOS runners) rejects GNU-style `{s/…/p}` blocks.
          crate_version=$(awk -F'"' '/^\[workspace\.package\]/ {f = 1; next} /^\[/ {f = 0} f && /^version *=/ {print $2; exit}' Cargo.toml)
          conf_version=$(awk -F'"' '/^  "version":/ {print $4; exit}' crates/as-gui/tauri.conf.json)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ] || [ "$conf_version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $crate_version / tauri.conf.json version $conf_version"
            exit 1
          fi

      - name: Front end dependencies
        working-directory: gui
        run: npm ci

      # `beforeBuildCommand` of tauri.conf.json builds the front end; the CLI is the devDependency of gui (no cargo install).
      - name: Build bundles
        working-directory: crates/as-gui
        shell: bash
        run: ../../gui/node_modules/.bin/tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect installers
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
          else
            version="dry-run-${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          # Stable, space-free names: the in-app update check picks the installer by `<label>` and extension.
          for ext in AppImage deb dmg msi; do
            for f in target/"$TARGET"/release/bundle/*/*."$ext"; do
              [ -f "$f" ] || continue
              out="dist/agent-studio-${version}-${LABEL}.${ext}"
              cp "$f" "$out"
              if command -v sha256sum > /dev/null; then
                (cd dist && sha256sum "$(basename "$out")" > "$(basename "$out").sha256")
              else
                (cd dist && shasum -a 256 "$(basename "$out")" > "$(basename "$out").sha256")
              fi
            done
          done
          ls -l dist
          cat dist/*.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish release
    needs: build
    # Only for tags; a manual run stops after `build` (dry run).
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: SHA256SUMS
        working-directory: dist
        run: |
          cat ./*.sha256 | sort -k2 > SHA256SUMS
          rm ./*.sha256
          cat SHA256SUMS
          ls -l

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.msi
            dist/SHA256SUMS
          generate_release_notes: true
          # `v0.2.0-rc.1` style tags are published as prereleases (the update check ignores them).
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
