[package]
name = "as-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
anyhow = "1.0.104"
as-core = { version = "0.1.2", path = "../as-core" }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = "0.4.45"
futures-util = { version = "0.3.34", features = ["sink"] }
interprocess = { version = "2.4.7", features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
tracing = "0.1.44"

[target."cfg(unix)".dependencies]
nix = { version = "0.28", features = ["signal"] }

[dev-dependencies]
tempfile = "3.27.0"
