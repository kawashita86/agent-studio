[package]
name = "as-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# Syntax highlighting (syntect, pure-Rust regex engine). The `agent-studio` binary enables it by default.
highlight = ["dep:syntect"]

[dependencies]
anyhow = "1.0.104"
as-core = { version = "0.1.0", path = "../as-core" }
as-proto = { version = "0.1.0", path = "../as-proto" }
base64 = "0.22"
chrono = "0.4.45"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"], optional = true }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tracing = "0.1.44"
unicode-width = "0.2.3"
vt100 = "0.18.1"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"
