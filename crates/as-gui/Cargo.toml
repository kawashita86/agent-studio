[package]
name = "as-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Agent Studio desktop app (Tauri shell around the React front end in gui/)"
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "agent-studio"
path = "src/main.rs"
# Never build/run a test harness for the binary: a test exe linking Tauri does not start on Windows.
test = false

[lib]
name = "as_gui"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
as-core = { version = "0.1.5", path = "../as-core" }
as-daemon = { version = "0.1.5", path = "../as-daemon" }
as-proto = { version = "0.1.5", path = "../as-proto" }
futures-util = { version = "0.3.34", features = ["sink"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.28"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
bytes = "1.12.1"
tempfile = "3.27.0"
tokio-util = "0.7.20"
